{% extends "base.html" %}
{% block title %}{{ t('login.title') }}{% endblock %}
{% block mainclass %}auth{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-brand"><img src="/static/favicon.svg" alt="" width="44" height="44"><h1>Budget Cockpit</h1></div>
  <p class="muted">{{ t('app.tagline') }}</p>
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>{{ t('login.username') }}<input name="username" autocomplete="username" required autofocus></label>
    <label>{{ t('login.password') }}<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">{{ t('login.submit') }}</button>
  </form>
  <form method="post" action="/lang" class="inline lang-switch">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="back" value="/login">
    <button class="link" name="lang" value="{{ 'en' if lang == 'fr' else 'fr' }}">{{ t('nav.other_language') }}</button>
  </form>
</div>
{% endblock %}
