{% extends "base.html" %}
{% block title %}{{ t('mfa.title') }}{% endblock %}
{% block content %}
<h1>{{ t('mfa.title') }}</h1>

<section class="panel totp-setup">
  <h2>{{ t('mfa.step_scan') }}</h2>
  <p>{{ t('mfa.scan_help') }}</p>
  <div class="qr"><img src="{{ qr }}" alt="{{ t('mfa.qr_alt') }}"></div>
  <details>
    <summary>{{ t('mfa.manual') }}</summary>
    <code class="token secret">{{ secret_groups|join(' ') }}</code>
    <p class="muted small">{{ t('mfa.manual_help') }}</p>
  </details>

  <h2>{{ t('mfa.step_confirm') }}</h2>
  <form method="post" action="/settings/totp/enable" class="form-grid">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>{{ t('mfa.code') }}
      <input name="code" class="code-input" autocomplete="one-time-code" inputmode="numeric" maxlength="7"
             pattern="[0-9 ]{6,7}" required autofocus></label>
    <label>{{ t('mfa.password') }}
      <input type="password" name="password" autocomplete="current-password" required></label>
    <div class="span2 buttons"><button class="primary">{{ t('mfa.enable') }}</button></div>
  </form>
  <form method="post" action="/settings/totp/disable" class="inline">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="link">{{ t('mfa.cancel') }}</button>
  </form>
</section>
{% endblock %}
